<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscripción confirmada · Scuderia St4ge</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a14;color:#f5f5fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:linear-gradient(180deg,#15152a,#1f1f3a);border:1px solid #2a2a4a;border-radius:18px;padding:48px 40px;max-width:520px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .check{width:64px;height:64px;border-radius:50%;background:rgba(62,196,119,.15);color:#3ec477;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px;font-weight:700}
  h1{font-size:22px;margin-bottom:6px}
  .sub{color:#9999b8;font-size:14px;margin-bottom:24px}
  .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2a2a4a;font-size:14px}
  .row:last-child{border-bottom:0}
  .lbl{color:#9999b8}
  .val{font-weight:600;color:#fff}
  .id{font-family:monospace;font-size:13px;color:#ffb800}
  .status{margin-top:18px;padding:14px;background:rgba(62,196,119,.08);border:1px solid rgba(62,196,119,.25);border-radius:10px;color:#3ec477;font-size:13px}
  a.btn{display:inline-block;margin-top:24px;padding:12px 24px;background:#ffb800;color:#0a0a14;text-decoration:none;border-radius:10px;font-weight:700;font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Inscripción confirmada</h1>
    <p class="sub">Te enviaremos los detalles a {{EMAIL}}</p>

    <div class="row"><span class="lbl">ID</span><span class="val id">{{ID}}</span></div>
    <div class="row"><span class="lbl">Piloto</span><span class="val">{{NOMBRE}}</span></div>
    <div class="row"><span class="lbl">Plan</span><span class="val">{{PLAN}}</span></div>
    <div class="row"><span class="lbl">Total del curso</span><span class="val">$ {{MONTO}} COP</span></div>
    <div class="row"><span class="lbl">Fecha</span><span class="val">{{FECHA}}</span></div>

    <div class="status">{{STATUS}}</div>
    <a class="btn" href="/inscripcion">Inscribir otro piloto</a>
  </div>
</body>
</html>
